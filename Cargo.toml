[package]
name = "docarmor"
version = "0.1.14"
edition = "2021"
authors = ["Jivtesh"]

[lib]
name = "docarmor"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.5.9"
rayon = "1.10.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31.0"
lopdf = "0.31.0"
calamine = "0.24.0"
csv = "1.3.0"
sha2 = "0.10.8"
regex = "1.10"

[features]
extension-module = ["pyo3/extension-module"]
default = []
